services:
  sshdesk:
    image: ghcr.io/qmdch1/gatedock:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - "127.0.0.1:9876:9876"
      # Use these Local ports in Tunnels, or add another loopback mapping here.
      - "127.0.0.1:18080-18089:18080-18089"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - sshdesk-data:/data
      - ${SSH_KEY_DIR:-./local/ssh}:/home/sshdesk/.ssh:ro

volumes:
  sshdesk-data:
